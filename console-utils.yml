---
- name: Set up the macOS terminal workspace
  hosts: localhost
  connection: local
  vars_files:
    - vars/main.yml

  pre_tasks:
    - name: Require macOS
      ansible.builtin.assert:
        that: ansible_facts['system'] == 'Darwin'
        fail_msg: This playbook provisions a macOS workstation with Homebrew.
      tags: always

  tasks:
    - name: Install terminal applications
      ansible.builtin.import_tasks: tasks/packages.yml
      tags: packages

    - name: Configure the terminal workspace
      ansible.builtin.import_tasks: tasks/config.yml
      tags: config

    - name: Use Fish as the login shell
      ansible.builtin.import_tasks: tasks/shell.yml
      when: set_fish_login_shell | bool
      tags: shell
