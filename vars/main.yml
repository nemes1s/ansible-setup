---
setup_home: "{{ ansible_facts['env']['HOME'] }}"
setup_user: "{{ ansible_facts['user_id'] }}"
config_home: "{{ setup_home }}/.config"
ghostty_config_dir: "{{ setup_home }}/Library/Application Support/com.mitchellh.ghostty"
ghostty_background: "#242424"
set_fish_login_shell: true

homebrew_formulae:
  - bat
  - eza
  - fd
  - fish
  - fzf
  - git
  - herdr
  - htop
  - lazydocker
  - lazygit
  - ncdu
  - neovim
  - node
  - anomalyco/tap/opencode
  - prettyping
  - procs
  - ripgrep
  - tldr
  - tree-sitter

# Claude Code plugins: plugin name plus the GitHub marketplace repo that offers it.
claude_plugins:
  - { name: linear, marketplace: anthropics/claude-plugins-official }
  - { name: ruby-lsp, marketplace: anthropics/claude-plugins-official }
  - { name: pyright-lsp, marketplace: anthropics/claude-plugins-official }
  - { name: plannotator, marketplace: backnotprop/plannotator }
  - { name: ponytail, marketplace: DietrichGebert/ponytail }
  - { name: pstack, marketplace: michael-denyer/pstack-claude }

# Standalone skills installed with `npx skills add` into ~/.claude/skills.
claude_skill_repos:
  - { name: unlazy, repo: Leonxlnx/unlazy }
