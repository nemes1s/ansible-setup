---
- name: Enable the OpenCode Homebrew tap
  community.general.homebrew_tap:
    name: anomalyco/tap
    state: present

- name: Install console tools and editor dependencies
  community.general.homebrew:
    name: "{{ homebrew_formulae }}"
    state: present

- name: Install Ghostty
  community.general.homebrew_cask:
    name: ghostty
    state: present
